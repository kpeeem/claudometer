name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio "esptool<5"

      - name: Build
        run: |
          cp src/secrets.h.example src/secrets.h
          pio run -e quotaboard -e quotaboard-bw

      - name: Package
        run: |
          version="$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/board.h)"
          if [[ "$GITHUB_REF_NAME" == v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match FW_VERSION $version" >&2
            exit 1
          fi
          boot_app0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir dist
          for pair in quotaboard:3c quotaboard-bw:bw; do
            build=".pio/build/${pair%%:*}"
            name="claudometer-$version-${pair##*:}"
            esptool.py --chip esp32s3 merge_bin -o "dist/$name.bin" \
              --flash_mode keep --flash_freq keep --flash_size keep \
              0x0 "$build/bootloader.bin" 0x8000 "$build/partitions.bin" \
              0xe000 "$boot_app0" 0x10000 "$build/firmware.bin"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claudometer-firmware
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Claudometer ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
